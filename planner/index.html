  setBody.addEventListener('input', e => {
    const el = e.target, tr = state.tracking;
    if (el.dataset.w) {
      if (el.dataset.w === 'target') tr.water.target = Math.max(0, +el.value || 0);
      if (el.dataset.w === 'unit') tr.water.unit = el.value.trim() || 'oz';
      if (el.dataset.w === 'quick') {
        const q = el.value.split(/[,\s]+/).map(Number).filter(n => n > 0);
        if (q.length) tr.water.quick = q.slice(0, 5);
      }
      persist(); return;
    }
    if (el.dataset.m) {
      const m = tr.metrics.find(x => x.id === el.closest('[data-mid]').dataset.mid);
      if (el.dataset.m === 'name') m.name = el.value;
      if (el.dataset.m === 'unit') m.unit = el.value;
      if (el.dataset.m === 'target') m.target = Math.max(0, +el.value || 0);
      if (el.dataset.m === 'rule') { m.rule = el.value; persist(); renderSettings(); return; }
      persist(); return;
    }
    if (el.dataset.t) {
      const m = taskMetricOf(el.closest('[data-tmid]').dataset.tmid);
      if (m) m[el.dataset.t] = el.value;
      persist(); return;
    }
    if (el.dataset.c) {
      const c = tr.checks.find(x => x.id === el.closest('[data-cid]').dataset.cid);
      c[el.dataset.c] = el.value;
      persist(); return;
    }
    const f = el.dataset.f;
    const brow = el.closest('[data-bid]'), grow = el.closest('[data-gid]');
    if (brow) {
      const b = bucketOf(brow.dataset.bid);
      if (b && (f === 'name' || f === 'color')) b[f] = el.value;
    } else if (grow) {
      const g = state.goals.find(x => x.id === grow.dataset.gid);
      if (!g) return;
      if (f === 'name') g.name = el.value;
      if (f === 'target') {
        g.target = Math.max(1, Math.round(+el.value || 1));
        const hr = grow.querySelector('[data-role="hr"]');
        if (hr) hr.textContent = g.metric === 'minutes' ? '= ' + fmtDur(g.target) : '';
      }
    }
    persist();
  });
  setBody.addEventListener('change', e => {
    const el = e.target, grow = el.closest('[data-gid]');
    if (!grow) { if (el.dataset.f === 'color') renderSettings(); return; }
    const g = state.goals.find(x => x.id === grow.dataset.gid);
    if (!g) return;
    if (el.dataset.f === 'metric') { g.metric = el.value; persist(); renderSettings(); }
    if (el.dataset.f === 'bucket') {
      g.bucketIds = [...grow.querySelectorAll('[data-f="bucket"]:checked')].map(x => x.value);
      persist();
    }
  });
  setBody.addEventListener('click', e => {
    const t = e.target;
    if (t.closest('[data-del-bucket]')) {
      const id = t.closest('[data-bid]').dataset.bid;
      state.buckets = state.buckets.filter(b => b.id !== id);
      for (const g of state.goals) g.bucketIds = g.bucketIds.filter(x => x !== id);
      persist(); renderSettings();
    } else if (t.closest('[data-del-goal]')) {
      const id = t.closest('[data-gid]').dataset.gid;
      state.goals = state.goals.filter(g => g.id !== id);
      persist(); renderSettings();
    } else if (t.id === 'addBucket') {
      state.buckets.push({ id: uid(), name: 'New bucket', color: PALETTE[state.buckets.length % PALETTE.length] });
      persist(); renderSettings();
      setBody.querySelector('[data-bid]:last-of-type [data-f="name"]')?.select();
    } else if (t.closest('[data-del-tm]')) {
      const id = t.closest('[data-tmid]').dataset.tmid, m = taskMetricOf(id);
      const using = state.goals.filter(g => g.metric === 'tm:' + id);
      if (!confirm(`Delete “${m.name}”? Tasks stop tracking it${using.length ? ` and the goal${using.length === 1 ? '' : 's'} ${using.map(g => '“' + g.name + '”').join(', ')} will be removed` : ''}. Numbers already logged stay in your export.`)) return;
      state.taskMetrics = state.taskMetrics.filter(x => x.id !== id);
      state.goals = state.goals.filter(g => g.metric !== 'tm:' + id);
      persist(); renderSettings();
    } else if (t.id === 'addTm') {
      state.taskMetrics.push({ id: uid(), name: 'New metric', unit: '' });
      persist(); renderSettings();
      [...setBody.querySelectorAll('[data-tmid] [data-t="name"]')].at(-1)?.select();
    } else if (t.id === 'addGoal') {
      state.goals.push({ id: uid(), name: 'New goal', bucketIds: [], metric: 'minutes', target: 30 });
      persist(); renderSettings();
      [...setBody.querySelectorAll('[data-gid] [data-f="name"]')].at(-1)?.select();
    } else if (t.closest('[data-del-metric]')) {
      const id = t.closest('[data-mid]').dataset.mid;
      state.tracking.metrics = state.tracking.metrics.filter(m => m.id !== id);
      persist(); renderSettings();
    } else if (t.closest('[data-del-check]')) {
      const id = t.closest('[data-cid]').dataset.cid;
      state.tracking.checks = state.tracking.checks.filter(c => c.id !== id);
      persist(); renderSettings();
    } else if (t.id === 'addMetric') {
      state.tracking.metrics.push({ id: uid(), name: 'New number', unit: '', rule: 'min', target: 0, since: todayKey() });
      persist(); renderSettings();
      [...setBody.querySelectorAll('[data-mid] [data-m="name"]')].at(-1)?.select();
    } else if (t.id === 'addCheck') {
      state.tracking.checks.push({ id: uid(), name: 'New question', want: 'no', since: todayKey() });
      persist(); renderSettings();
      [...setBody.querySelectorAll('[data-cid] [data-c="name"]')].at(-1)?.select();
    } else if (t.id === 'exportBtn') {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: `planner-${todayKey()}.json` });
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    } else if (t.id === 'importBtn') {
      $('#importFile').click();
    } else if (t.id === 'wipeBtn') {
      if (confirm('Erase every day, routine, bucket and goal and go back to the starting routine?')) {
        state = normalize(seed()); persist(); renderSettings(); render();
      }
    }
  });
  $('#importFile').addEventListener('change', async e => {
    const file = e.target.files[0]; e.target.value = '';
    if (!file) return;
    try {
      const s = JSON.parse(await file.text());
      if (!valid(s)) throw new Error('bad');
      state = normalize(s);
      persist(); renderSettings(); render();
      toast('Imported.');
    } catch { toast('That file isn’t a planner export.'); }
  });
  const closeSettings = () => { setDlg.close(); };
  $('#closeSet').addEventListener('click', closeSettings);
  $('#doneSet').addEventListener('click', closeSettings);
  setDlg.addEventListener('close', render);
  $('#settingsBtn').addEventListener('click', openSettings);

  // ---------- toast ----------
  let toastTimer;
  function toast(msg, undo) {
    const el = $('#toast');
    el.innerHTML = esc(msg) + (undo ? '<button type="button">Undo</button>' : '');
    if (undo) el.querySelector('button').onclick = () => { el.classList.remove('show'); undo(); };
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), undo ? 6000 : 3000);
  }

  // Keep the "now" highlight moving, and roll over at midnight if left open.
  let lastToday = todayKey();
  setInterval(() => {
    if (drag || dlg.open || setDlg.open) return;
    const t = todayKey();
    if (t !== lastToday) { if (view.date === lastToday) view.date = t; lastToday = t; }
    if (view.tab === 'day' && view.date === t) render();
  }, 60000);

  render();
})();
</script>
</body>
</html>
