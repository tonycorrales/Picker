# Only needed if you deploy with the wrangler CLI. The dashboard route in
# the README sets these same three things by hand.
name = "sunday-slip"
main = "worker.js"
compatibility_date = "2026-01-01"

# Friday 11:59pm ET, which is Saturday in UTC — hence SAT, not FRI.
# 03:59 UTC is 11:59pm Friday while daylight time is in effect and
# 10:59pm once it ends; the 04:59 run is a retry that no-ops if the
# first already froze the board.
#
# Cloudflare's weekday field is 1-7 with 1 = Sunday, NOT the usual 0-6 —
# a plain number is easy to get wrong, so use the abbreviation.
#
# The third is Nightly Slip (NBA): 8am ET every day. 12:00 UTC is 8am in
# summer and 7am in winter, 13:00 is 8am in winter; the Worker skips any
# run before 8am ET and treats the rest as no-op retries. One expression,
# so it uses one trigger.
[triggers]
crons = ["59 3 * * SAT", "59 4 * * SAT", "0 12,13,14 * * *"]

[[kv_namespaces]]
binding = "PICKS"
id = "PASTE_YOUR_KV_NAMESPACE_ID"
